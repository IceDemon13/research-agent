services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_agent}
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_agent} -d ${POSTGRES_DB:-research_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      gitnexus:
        condition: service_started
      validation-runner:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      STRONG_MODEL_NAME: ${STRONG_MODEL_NAME:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://research_agent:research_agent@postgres:5432/research_agent}
      POSTGRES_USER: ${POSTGRES_USER:-research_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_agent}
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      DEFAULT_ACTOR_ROLE: ${DEFAULT_ACTOR_ROLE:-admin}
      DEFAULT_ACTOR_DISPLAY_NAME: ${DEFAULT_ACTOR_DISPLAY_NAME:-Local CLI}
      AUTO_PUBLISH_IMPLEMENTATION_RUNS: ${AUTO_PUBLISH_IMPLEMENTATION_RUNS:-false}
      ALLOW_REAL_APPLY: ${ALLOW_REAL_APPLY:-false}
      ALLOW_PR_CREATION: ${ALLOW_PR_CREATION:-false}
      ALLOW_REVIEW_CREATION: ${ALLOW_REVIEW_CREATION:-false}
      VALIDATION_BUILD_COMMAND: ${VALIDATION_BUILD_COMMAND:-}
      VALIDATION_LINT_COMMAND: ${VALIDATION_LINT_COMMAND:-}
      VALIDATION_TEST_COMMAND: ${VALIDATION_TEST_COMMAND:-}
      VALIDATION_RUNNER_ENABLED: ${VALIDATION_RUNNER_ENABLED:-true}
      VALIDATION_RUNNER_BASE_URL: ${VALIDATION_RUNNER_BASE_URL:-http://validation-runner:8091}
      VALIDATION_RUNNER_TYPE: ${VALIDATION_RUNNER_TYPE:-http_dotnet_sdk}
      VALIDATION_RUNNER_TIMEOUT_SECONDS: ${VALIDATION_RUNNER_TIMEOUT_SECONDS:-180}
      REPO_CLONE_TIMEOUT_SECONDS: ${REPO_CLONE_TIMEOUT_SECONDS:-300}
      REPO_CLONE_ROOT: ${REPO_CLONE_ROOT:-/repos}
      REPO_INTELLIGENCE_PROVIDER: ${REPO_INTELLIGENCE_PROVIDER:-native}
      GITNEXUS_ENABLED: ${GITNEXUS_ENABLED:-true}
      GITNEXUS_USE_SKILLS: ${GITNEXUS_USE_SKILLS:-true}
      GITNEXUS_USE_EMBEDDINGS: ${GITNEXUS_USE_EMBEDDINGS:-false}
      GITNEXUS_REPO_ALLOWLIST: ${GITNEXUS_REPO_ALLOWLIST:-}
      GITNEXUS_TIMEOUT_SECONDS: ${GITNEXUS_TIMEOUT_SECONDS:-120}
      GITNEXUS_VERSION: ${GITNEXUS_VERSION:-latest}
      GITNEXUS_PORT: ${GITNEXUS_PORT:-3010}
      GITNEXUS_HOME: ${GITNEXUS_HOME:-/gitnexus}
      GITNEXUS_REPO_ROOT: ${GITNEXUS_REPO_ROOT:-/repos}
      GITNEXUS_INTERNAL_BASE_URL: ${GITNEXUS_INTERNAL_BASE_URL:-http://gitnexus:3010}
      GITNEXUS_EXTERNAL_UI_URL: ${GITNEXUS_EXTERNAL_UI_URL:-}
      BITBUCKET_API_BASE_URL: ${BITBUCKET_API_BASE_URL:-https://api.bitbucket.org/2.0}
      BITBUCKET_REPO_TOKEN: ${BITBUCKET_REPO_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN:-}
      CRUCIBLE_BASE_URL: ${CRUCIBLE_BASE_URL:-}
      CRUCIBLE_USERNAME: ${CRUCIBLE_USERNAME:-}
      CRUCIBLE_PASSWORD: ${CRUCIBLE_PASSWORD:-}
      CRUCIBLE_API_TOKEN: ${CRUCIBLE_API_TOKEN:-}
      CRUCIBLE_PROJECT_KEY: ${CRUCIBLE_PROJECT_KEY:-}
      CRUCIBLE_DEFAULT_REVIEWERS: ${CRUCIBLE_DEFAULT_REVIEWERS:-}
      PYTHONUTF8: "1"
    ports:
      - "8000:8000"
    volumes:
      - app_artifacts:/app/artifacts
      - ./artifacts/draft_patch_applies:/app/artifacts/draft_patch_applies
      - ./artifacts/draft_patch_executions:/app/artifacts/draft_patch_executions
      - app_logs:/app/logs
      - app_index:/app/index
      - app_data:/app/data
      - app_repos:/repos

  validation-runner:
    build:
      context: .
      dockerfile: docker/validation-runner.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VALIDATION_RUNNER_PORT: ${VALIDATION_RUNNER_PORT:-8091}
      VALIDATION_RUNNER_ALLOWED_ROOTS: ${VALIDATION_RUNNER_ALLOWED_ROOTS:-/app/artifacts/temp-workspaces,/repos}
      VALIDATION_RUNNER_OUTPUT_MAX_CHARS: ${VALIDATION_RUNNER_OUTPUT_MAX_CHARS:-12000}
      VALIDATION_RUNNER_GLOBAL_NUGET_CONFIG_PATHS: ${VALIDATION_RUNNER_GLOBAL_NUGET_CONFIG_PATHS:-/root/.nuget/NuGet/NuGet.Config,/root/.config/NuGet/NuGet.Config,/validation/machine-nuget-config/Microsoft.VisualStudio.Offline.config,/validation/machine-nuget-config/Microsoft.VisualStudio.FallbackLocation.config}
      VALIDATION_RUNNER_GLOBAL_NUGET_CONFIG_DIRS: ${VALIDATION_RUNNER_GLOBAL_NUGET_CONFIG_DIRS:-/root/.nuget/NuGet/config,/validation/machine-nuget-config}
      VALIDATION_RUNNER_EXTRA_NUGET_SOURCES: ${VALIDATION_RUNNER_EXTRA_NUGET_SOURCES:-https://nuget.telemart.ua/v3/index.json}
      VALIDATION_RUNNER_MACHINE_NUGET_CONFIG_DIR: ${VALIDATION_RUNNER_MACHINE_NUGET_CONFIG_DIR:-C:/Program Files (x86)/NuGet/Config}
      VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: ${VSS_NUGET_EXTERNAL_FEED_ENDPOINTS:-}
      ARTIFACTS_CREDENTIALPROVIDER_FEED_ENDPOINTS: ${ARTIFACTS_CREDENTIALPROVIDER_FEED_ENDPOINTS:-}
      NUGET_CREDENTIALPROVIDER_SESSIONTOKENCACHE_ENABLED: ${NUGET_CREDENTIALPROVIDER_SESSIONTOKENCACHE_ENABLED:-}
      NUGET_PLUGIN_PATHS: ${NUGET_PLUGIN_PATHS:-}
      NUGET_PACKAGES: ${NUGET_PACKAGES:-}
      NUGET_HTTP_CACHE_PATH: ${NUGET_HTTP_CACHE_PATH:-}
    volumes:
      - app_artifacts:/app/artifacts
      - app_repos:/repos
      - type: bind
        source: ${APPDATA}/NuGet
        target: /root/.nuget/NuGet
        read_only: true
      - type: bind
        source: ${APPDATA}/NuGet/config
        target: /root/.nuget/NuGet/config
        read_only: true
      - type: bind
        source: ${USERPROFILE}/.nuget/packages
        target: /root/.nuget/packages
      - type: bind
        source: ${VALIDATION_RUNNER_MACHINE_NUGET_CONFIG_DIR:-C:/Program Files (x86)/NuGet/Config}
        target: /validation/machine-nuget-config
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  gitnexus:
    image: node:22-trixie
    restart: unless-stopped
    working_dir: /gitnexus
    environment:
      GITNEXUS_ENABLED: ${GITNEXUS_ENABLED:-true}
      GITNEXUS_CONTROL_ENABLED: ${GITNEXUS_CONTROL_ENABLED:-true}
      GITNEXUS_VERSION: ${GITNEXUS_VERSION:-latest}
      GITNEXUS_PORT: ${GITNEXUS_PORT:-3010}
      GITNEXUS_MCP_PORT_INTERNAL: ${GITNEXUS_MCP_PORT_INTERNAL:-3011}
      GITNEXUS_HOME: ${GITNEXUS_HOME:-/gitnexus}
      GITNEXUS_REPO_ROOT: ${GITNEXUS_REPO_ROOT:-/repos}
      GITNEXUS_USE_SKILLS: ${GITNEXUS_USE_SKILLS:-true}
      GITNEXUS_USE_EMBEDDINGS: ${GITNEXUS_USE_EMBEDDINGS:-false}
    command:
      - node
      - /opt/gitnexus-sidecar-server.mjs
    ports:
      - "${GITNEXUS_PORT:-3010}:${GITNEXUS_PORT:-3010}"
      - "${GITNEXUS_MCP_PORT_INTERNAL:-3011}:${GITNEXUS_MCP_PORT_INTERNAL:-3011}"
    volumes:
      - app_repos:/repos
      - gitnexus_home:/gitnexus
      - ./scripts/gitnexus-sidecar-server.mjs:/opt/gitnexus-sidecar-server.mjs:ro

  gitnexus-web:
    image: node:22-trixie
    restart: unless-stopped
    working_dir: /opt
    depends_on:
      gitnexus:
        condition: service_started
    environment:
      GITNEXUS_WEB_BACKEND_URL: ${GITNEXUS_WEB_BACKEND_URL:-}
    command: >
      bash -lc "
        apt-get update &&
        apt-get install -y git &&
        node /opt/bootstrap-gitnexus-web.mjs &&
        cd /opt/GitNexus/gitnexus-web &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "5173:5173"
    volumes:
      - ./scripts/bootstrap-gitnexus-web.mjs:/opt/bootstrap-gitnexus-web.mjs:ro

volumes:
  postgres_data:
  app_artifacts:
  app_logs:
  app_index:
  app_data:
  app_repos:
  gitnexus_home:

