name: Python Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repo-context test suite
        run: python -m unittest tests.test_repo_commands

      - name: Run full unittest suite
        run: python -m unittest
